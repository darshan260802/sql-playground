<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Learn SQL on real data: a MySQL playground with your own private copy of the database, and lessons from SELECT to window functions." />
    <title>SQL Playground</title>
    <script>
      // apply the saved theme before first paint so there is no flash
      try {
        var t = JSON.parse(localStorage.getItem('sqlpg.theme') || '{}').state
        if (t && t.theme) document.documentElement.dataset.theme = t.theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
