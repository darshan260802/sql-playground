# SQL Playground: MySQL 8.4 + the Go app (which also serves the frontend).
#
#   cp .env.example .env   # set a strong MYSQL_ROOT_PASSWORD
#   docker compose up -d --build
#
# Nothing here is reachable from the internet directly:
#   - MySQL has no published port; only the app container can reach it.
#   - The app listens on 127.0.0.1 only. Docker-published ports bypass ufw,
#     so binding to loopback keeps ufw in charge; nginx on the host proxies
#     your domain to it (see nginx/sql-playground.conf).

name: sql-playground

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/playground.cnf:/etc/mysql/conf.d/playground.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    # memory ceiling for MySQL (buffer pool 2G + sessions + performance_schema)
    mem_limit: ${MYSQL_MEM_LIMIT:-3g}

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SQLPG_MYSQL_ADDR: mysql:3306
      SQLPG_MYSQL_ADMIN_USER: root
      SQLPG_MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SQLPG_TRUST_PROXY: "true"
      SQLPG_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SQLPG_MAX_USERS: ${MAX_USERS:-20}
      SQLPG_USER_QUOTA_MB: ${USER_QUOTA_MB:-300}
      SQLPG_QUERY_TIMEOUT: ${QUERY_TIMEOUT:-30s}
      SQLPG_ANON_QUERY_TIMEOUT: ${ANON_QUERY_TIMEOUT:-15s}
      SQLPG_MAX_ROWS: ${MAX_ROWS:-2000}
      SQLPG_MAX_CONCURRENT: ${MAX_CONCURRENT:-8}
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    mem_limit: 512m

volumes:
  mysql-data:
