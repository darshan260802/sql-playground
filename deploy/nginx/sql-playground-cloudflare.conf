# /etc/nginx/sites-available/sql-playground.conf
#
# HTTPS site for a domain proxied by Cloudflare (orange cloud) using a
# Cloudflare Origin Certificate, with Cloudflare SSL/TLS mode "Full (strict)".
# Replace sql.example.com (2 places) with your hostname.
#
# Visitor IPs: run deploy/scripts/cloudflare-realip.sh once so nginx trusts
# Cloudflare's edge and $remote_addr becomes the real visitor IP.

upstream sql_playground {
    server 127.0.0.1:8080;   # SQLPG_LISTEN in /etc/sql-playground/config.env
    keepalive 16;
}

# Plain HTTP only redirects (Cloudflare normally upgrades before reaching us).
server {
    listen 80;
    listen [::]:80;
    server_name sql.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sql.example.com;

    ssl_certificate     /etc/ssl/cloudflare/sql-playground.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sql-playground.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://sql_playground;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # real visitor IP (see cloudflare-realip.sh)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # queries may run up to the configured timeout (30s by default)
        proxy_read_timeout 90s;
        # stream large files instead of buffering them to disk, so a full disk or a
        # read-only temp folder can't cut downloads short
        proxy_max_temp_file_size 0;
    }
}
