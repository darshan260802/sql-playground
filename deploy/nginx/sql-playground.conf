# /etc/nginx/sites-available/sql-playground  (symlink into sites-enabled)
# Replace sql.example.com with your domain, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sql.example.com      # adds HTTPS + redirect

upstream sql_playground {
    server 127.0.0.1:8080;   # APP_PORT from deploy/.env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sql.example.com;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://sql_playground;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # queries may run up to the configured timeout (30s by default)
        proxy_read_timeout 90s;
    }
}
